services:
  app:
    build: .
    container_name: altto-calculadora
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      APP_SECRET: ${APP_SECRET:?Defina APP_SECRET no .env}
      DB_HOST: ${DB_HOST_DOCKER:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3305}
      DB_NAME: ${DB_NAME:-am_altto_calculator}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-altto2026}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      USER_ELIZEU_PASSWORD: ${USER_ELIZEU_PASSWORD:-}
      USER_ELIZEU_ROLE: ${USER_ELIZEU_ROLE:-manager}
      USER_VENDEDOR_PASSWORD: ${USER_VENDEDOR_PASSWORD:-}
      USER_VENDEDOR_ROLE: ${USER_VENDEDOR_ROLE:-seller}
      USER_ADMIN_PASSWORD: ${USER_ADMIN_PASSWORD:-}
      USER_ADMIN_ROLE: ${USER_ADMIN_ROLE:-admin}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_SELLER_PASSWORD: ${DEMO_SELLER_PASSWORD:-}
    volumes:
      - altto_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  altto_data:
